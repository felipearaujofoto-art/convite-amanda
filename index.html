<!DOCTYPE html>
<!-- ==========================================================

  2) WhatsApp da confirmação de presença: linha marcada com
     [WHATSAPP]. Formato: 55 + DDD + número, sem espaços.
     Configurado: 5596991046703  →  (96) 9 9104-6703
  3) Suba TODOS estes arquivos juntos no GitHub Pages:

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite · Amanda Beatriz — 15 Anos</title>
<meta name="description" content="Convite especial: Amanda Beatriz, 15 anos. Sábado, 26 de setembro de 2026, às 19h.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo-deep:#26050c;
    --bordo:#480d1a;
    --wine:#671426;
    --rose-glow:#8e3550;
    --gold:#d9a441;
    --gold-light:#f3d9a4;
    --gold-dim:#a97b2f;
    --ink:#f7ecd8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Cormorant Garamond',serif;
    color:var(--ink);
    background:
      radial-gradient(130% 85% at 50% -5%, var(--rose-glow) 0%, var(--wine) 34%, var(--bordo) 62%, var(--bordo-deep) 100%);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }

  /* ---------- brilhos flutuantes ---------- */
  .sparkles{position:fixed;inset:0;pointer-events:none;z-index:0}
  .sparkles span{
    position:absolute;bottom:-4vh;
    width:5px;height:5px;border-radius:50%;
    background:radial-gradient(circle,var(--gold-light) 0%,rgba(217,164,65,.55) 45%,transparent 72%);
    filter:blur(.4px);
    animation:rise linear infinite;
    opacity:0;
  }
  .sparkles span:nth-child(1){left:8%;animation-duration:14s;animation-delay:0s;width:4px;height:4px}
  .sparkles span:nth-child(2){left:22%;animation-duration:18s;animation-delay:3s}
  .sparkles span:nth-child(3){left:37%;animation-duration:12s;animation-delay:6s;width:3px;height:3px}
  .sparkles span:nth-child(4){left:52%;animation-duration:20s;animation-delay:1.5s}
  .sparkles span:nth-child(5){left:66%;animation-duration:15s;animation-delay:8s;width:6px;height:6px}
  .sparkles span:nth-child(6){left:79%;animation-duration:17s;animation-delay:4.5s;width:3px;height:3px}
  .sparkles span:nth-child(7){left:90%;animation-duration:13s;animation-delay:10s}
  .sparkles span:nth-child(8){left:45%;animation-duration:22s;animation-delay:12s;width:4px;height:4px}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    12%{opacity:.9}
    55%{opacity:.55;transform:translateY(-52vh) translateX(10px)}
    100%{transform:translateY(-108vh) translateX(-8px);opacity:0}
  }

  /* ---------- respiração do brilho do topo ---------- */
  body::after{
    content:"";position:fixed;left:50%;top:-18vh;transform:translateX(-50%);
    width:130vw;height:62vh;pointer-events:none;z-index:0;
    background:radial-gradient(closest-side,rgba(214,122,146,.28),rgba(142,53,80,.12) 55%,transparent 78%);
    animation:breathe 7s ease-in-out infinite alternate;
  }
  @keyframes breathe{from{opacity:.45}to{opacity:1}}

  /* ---------- pétalas caindo ---------- */
  .petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .petals i{
    position:absolute;top:-6vh;display:block;
    background:radial-gradient(circle at 32% 30%,#a12437,#6e1425 60%,#470c17);
    border-radius:62% 38% 58% 42% / 46% 62% 38% 54%;
    box-shadow:inset -2px -2px 4px rgba(0,0,0,.4);
    opacity:0;animation:fall linear infinite;
  }
  .petals i:nth-child(1){left:5%;width:13px;height:10px;animation-duration:14s;animation-delay:0s}
  .petals i:nth-child(2){left:24%;width:16px;height:12px;animation-duration:18s;animation-delay:5s}
  .petals i:nth-child(3){left:47%;width:11px;height:9px;animation-duration:12s;animation-delay:9s}
  .petals i:nth-child(4){left:63%;width:15px;height:11px;animation-duration:16s;animation-delay:2.5s}
  .petals i:nth-child(5){left:81%;width:12px;height:10px;animation-duration:19s;animation-delay:12s}
  .petals i:nth-child(6){left:92%;width:14px;height:11px;animation-duration:15s;animation-delay:7s}
  @keyframes fall{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}
    8%{opacity:.85}
    50%{transform:translateY(54vh) translateX(28px) rotate(210deg);opacity:.8}
    100%{transform:translateY(114vh) translateX(-16px) rotate(430deg);opacity:0}
  }

  /* ---------- bokeh dourado ---------- */
  .bokeh{position:fixed;inset:0;pointer-events:none;z-index:0}
  .bokeh b{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle,rgba(243,217,164,.5),rgba(217,164,65,.16) 55%,transparent 74%);
    filter:blur(6px);animation:driftb ease-in-out infinite alternate;
  }
  .bokeh b:nth-child(1){left:8%;top:16%;width:64px;height:64px;animation-duration:11s}
  .bokeh b:nth-child(2){left:74%;top:9%;width:96px;height:96px;animation-duration:15s;animation-delay:2s}
  .bokeh b:nth-child(3){left:16%;top:62%;width:52px;height:52px;animation-duration:13s;animation-delay:5s}
  .bokeh b:nth-child(4){left:82%;top:56%;width:72px;height:72px;animation-duration:17s;animation-delay:3.5s}
  .bokeh b:nth-child(5){left:44%;top:84%;width:58px;height:58px;animation-duration:12s;animation-delay:7s}
  @keyframes driftb{
    from{transform:translateY(14px) scale(.93);opacity:.3}
    to{transform:translateY(-24px) scale(1.07);opacity:.65}
  }

  /* ---------- estrelinhas piscando ---------- */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0}
  .stars i{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 7px 1.5px rgba(243,217,164,.75);
    animation:twinkle ease-in-out infinite;
  }
  .stars i:nth-child(1){left:12%;top:22%;animation-duration:3.2s}
  .stars i:nth-child(2){left:31%;top:9%;animation-duration:4.1s;animation-delay:1s}
  .stars i:nth-child(3){left:58%;top:15%;animation-duration:2.8s;animation-delay:.5s}
  .stars i:nth-child(4){left:86%;top:27%;animation-duration:3.7s;animation-delay:1.8s}
  .stars i:nth-child(5){left:7%;top:48%;animation-duration:4.4s;animation-delay:2.4s}
  .stars i:nth-child(6){left:91%;top:44%;animation-duration:3s;animation-delay:.9s}
  .stars i:nth-child(7){left:23%;top:78%;animation-duration:3.9s;animation-delay:1.4s}
  .stars i:nth-child(8){left:70%;top:88%;animation-duration:3.4s;animation-delay:2.9s}
  @keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.95}}

  main{
    position:relative;z-index:1;
    width:100%;max-width:430px;
    padding:34px 22px 46px;
    text-align:center;
  }

  /* ---------- cabeçalho ---------- */
  .eyebrow{
    font-size:.78rem;letter-spacing:.42em;text-indent:.42em;
    text-transform:uppercase;color:var(--gold-dim);font-weight:500;
  }
  h1{
    font-family:'Great Vibes',cursive;font-weight:400;
    font-size:clamp(2.9rem,12vw,3.6rem);
    line-height:1.08;margin:10px 0 4px;
    background:linear-gradient(178deg,var(--gold-light) 12%,var(--gold) 52%,var(--gold-dim) 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 26px rgba(217,164,65,.28);
  }
  .years{
    display:flex;align-items:center;justify-content:center;gap:14px;
    color:var(--gold);font-size:.95rem;letter-spacing:.5em;text-indent:.5em;
    text-transform:uppercase;font-weight:500;margin-bottom:26px;
  }
  .years::before,.years::after{
    content:"";height:1px;width:44px;
    background:linear-gradient(90deg,transparent,var(--gold-dim));
  }
  .years::after{background:linear-gradient(90deg,var(--gold-dim),transparent)}

  /* ---------- vídeo ---------- */
  .video-frame{
    position:relative;border-radius:14px;padding:7px;
    background:linear-gradient(160deg,var(--gold-light),var(--gold-dim) 38%,var(--gold) 68%,var(--gold-light));
    box-shadow:0 14px 44px rgba(0,0,0,.5),0 0 60px rgba(217,164,65,.14);
  }
  .video-frame::after{
    content:"";position:absolute;inset:3px;border-radius:11px;
    border:1px solid rgba(38,5,12,.55);pointer-events:none;
  }
  video{
    display:block;width:100%;aspect-ratio:9/16;
    border-radius:9px;background:var(--bordo-deep);object-fit:cover;
  }

  /* ---------- chamada ---------- */
  .lead{
    font-family:'Great Vibes',cursive;font-weight:400;
    font-size:1.9rem;line-height:1.25;color:var(--gold-light);
    margin:34px 0 26px;text-shadow:0 0 18px rgba(243,217,164,.25);
  }

  /* ---------- medalhões ---------- */
  .medallions{
    display:grid;grid-template-columns:1fr 1fr;
    gap:30px 18px;justify-items:center;
  }
  .medallion{
    display:flex;flex-direction:column;align-items:center;gap:11px;
    text-decoration:none;background:none;border:none;cursor:pointer;
    font-family:inherit;color:inherit;
  }
  .coin{
    position:relative;width:118px;height:118px;border-radius:50%;
    transition:transform .25s ease;
  }
  .coin::before{
    content:"";position:absolute;inset:-9px;border-radius:50%;z-index:-1;
    background:conic-gradient(from 0deg,
      rgba(217,164,65,.14) 0%,rgba(217,164,65,.14) 66%,
      var(--gold-light) 80%,rgba(217,164,65,.14) 94%);
    animation:ring 7s linear infinite;filter:blur(2.5px);
  }
  @keyframes ring{to{transform:rotate(360deg)}}
  .coin img{
    display:block;width:100%;height:100%;
    filter:drop-shadow(0 7px 18px rgba(0,0,0,.5));
  }
  .medallion span{
    font-family:'Great Vibes',cursive;font-size:1.35rem;line-height:1.1;
    color:var(--gold-light);max-width:150px;
  }
  .medallion:hover .coin,.medallion:focus-visible .coin{transform:scale(1.07)}
  .medallion:focus-visible{outline:none}
  .medallion:focus-visible .coin{box-shadow:0 0 0 3px var(--gold-light);border-radius:50%}

  /* ---------- detalhes ---------- */
  .details{
    margin-top:44px;padding-top:26px;position:relative;
    font-size:1.02rem;letter-spacing:.18em;text-indent:.18em;
    text-transform:uppercase;color:var(--ink);line-height:2;font-weight:500;
  }
  .details::before{
    content:"❦";position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    color:var(--gold-dim);font-size:1.1rem;letter-spacing:0;text-indent:0;
  }
  .details strong{color:var(--gold-light);font-weight:600}

  /* ---------- cartão do dress code ---------- */
  .overlay{
    position:fixed;inset:0;z-index:10;display:none;
    align-items:center;justify-content:center;padding:26px;
    background:rgba(18,2,6,.82);backdrop-filter:blur(5px);
  }
  .overlay.open{display:flex}
  .card{
    width:100%;max-width:330px;border-radius:14px;padding:8px;
    background:linear-gradient(160deg,var(--gold-light),var(--gold-dim) 40%,var(--gold));
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .card-inner{
    border-radius:9px;padding:36px 26px 30px;text-align:center;
    background:radial-gradient(120% 100% at 50% 0%,var(--wine) 0%,var(--bordo) 55%,var(--bordo-deep) 100%);
    border:1px solid rgba(243,217,164,.35);
  }
  .card-inner h2{
    font-family:'Great Vibes',cursive;font-weight:400;font-size:2.4rem;
    color:var(--gold-light);margin-bottom:14px;
  }
  .card-inner p{
    font-size:1.25rem;letter-spacing:.24em;text-indent:.24em;
    text-transform:uppercase;color:var(--ink);font-weight:600;line-height:1.7;
  }
  .card-inner small{
    display:block;margin-top:14px;font-size:.95rem;color:var(--gold-dim);
    letter-spacing:.06em;font-style:italic;
  }
  .close{
    margin-top:24px;padding:9px 30px;cursor:pointer;
    background:none;border:1px solid var(--gold);border-radius:999px;
    color:var(--gold-light);font-family:'Cormorant Garamond',serif;
    font-size:.9rem;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;
    transition:background .2s ease;
  }
  .close:hover,.close:focus-visible{background:rgba(217,164,65,.16);outline:none}

  @media (prefers-reduced-motion:reduce){
    .coin::before,body::after{animation:none}
    .sparkles,.petals,.bokeh,.stars{display:none}
  }
</style>
</head>
<body>

<div class="sparkles" aria-hidden="true">
  <span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span>
</div>

<div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="bokeh" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div>
<div class="stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<main>
  <p class="eyebrow">Convite Especial</p>
  <h1>Amanda Beatriz</h1>
  <p class="years">15 anos</p>

  <div class="video-frame">
    <!-- [VÍDEO] troque "convite.mp4" se o arquivo tiver outro nome -->
    <video src="convite.mp4" controls playsinline preload="metadata"></video>
  </div>

  <p class="lead">Para tudo ser perfeito,<br>toque nos botões abaixo</p>

  <nav class="medallions" aria-label="Botões do convite">

    <a class="medallion" href="https://maps.app.goo.gl/9YoqhsLTupjF2QZ79" target="_blank" rel="noopener">
      <div class="coin" aria-hidden="true"><img src="localizacao.webp" alt="" loading="lazy"></div>
      <span>Localização</span>
    </a>

    <!-- [WHATSAPP] 55 + DDD + número, sem espaços -->
    <a class="medallion" href="https://wa.me/5596991046703?text=Ol%C3%A1!%20Confirmo%20minha%20presen%C3%A7a%20na%20festa%20de%2015%20anos%20da%20Amanda%20Beatriz!%20%F0%9F%91%91%E2%9C%A8" target="_blank" rel="noopener">
      <div class="coin" aria-hidden="true"><img src="confirmacao.webp" alt="" loading="lazy"></div>
      <span>Confirmação<br>de Presença</span>
    </a>

    <a class="medallion" href="https://maps.app.goo.gl/mk336QyxR8EkzkYu6?g_st=ac" target="_blank" rel="noopener">
      <div class="coin" aria-hidden="true"><img src="presentes.webp" alt="" loading="lazy"></div>
      <span>Sugestão<br>de Presentes</span>
    </a>

    <button class="medallion" type="button" id="dressBtn" aria-haspopup="dialog">
      <div class="coin" aria-hidden="true"><img src="dresscode.webp" alt="" loading="lazy"></div>
      <span>Dress Code</span>
    </button>

  </nav>

  <p class="details">
    Sábado · <strong>26 de setembro de 2026</strong> · às <strong>19h</strong><br>
    Av. Timbiras, 54 — Buritizal
  </p>
</main>

<div class="overlay" id="dressOverlay" role="dialog" aria-modal="true" aria-labelledby="dressTitle">
  <div class="card">
    <div class="card-inner">
      <h2 id="dressTitle">Dress Code</h2>
      <p>Esporte Fino<br>/ Passeio</p>
      <small>Venha elegante e confortável ✦</small>
      <button class="close" type="button" id="dressClose">Fechar</button>
    </div>
  </div>
</div>

<script>
  const overlay=document.getElementById('dressOverlay');
  const openBtn=document.getElementById('dressBtn');
  const closeBtn=document.getElementById('dressClose');
  openBtn.addEventListener('click',()=>{overlay.classList.add('open');closeBtn.focus()});
  closeBtn.addEventListener('click',()=>{overlay.classList.remove('open');openBtn.focus()});
  overlay.addEventListener('click',e=>{if(e.target===overlay){overlay.classList.remove('open');openBtn.focus()}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open')){overlay.classList.remove('open');openBtn.focus()}});
</script>
</body>
</html>
